name: ci

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          find apps core tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Export compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: e456309491fd875487bf02b8a0dca76c1b1b00cc
      - name: Configure and build
        run: |
          export VCPKG_ROOT="${{ github.workspace }}/vcpkg"
          cmake --preset ci-linux
          cmake --build --preset ci-linux
      - name: Unit tests
        run: ./build/ci-linux/tests/agentgate_unit_tests

  asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: e456309491fd875487bf02b8a0dca76c1b1b00cc
      - name: Configure and build
        run: |
          export VCPKG_ROOT="${{ github.workspace }}/vcpkg"
          cmake --preset ci-asan
          cmake --build --preset ci-asan
      - name: Unit tests
        run: ./build/ci-asan/tests/agentgate_unit_tests

  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build postgresql-client
      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: e456309491fd875487bf02b8a0dca76c1b1b00cc
      - name: Configure and build
        run: |
          export VCPKG_ROOT="${{ github.workspace }}/vcpkg"
          cmake --preset ci-linux
          cmake --build --preset ci-linux
      - name: Migrate
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: agentgate
          PGPASSWORD: postgres
          AGENTGATE_API_PASSWORD: local-dev-api-password
          AGENTGATE_WORKER_PASSWORD: local-dev-worker-password
          AGENTGATE_MIGRATOR_PASSWORD: local-dev-migrator-password
          AGENTGATE_SEED: "true"
        run: packages/db/migrate.sh
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node tests
        env:
          AGENTGATE_API_BIN: build/ci-linux/apps/api/agentgate-api
          AGENTGATE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agentgate
          AGENTGATE_TEST_API_DATABASE_URL: postgresql://agentgate_api:local-dev-api-password@127.0.0.1:5432/agentgate
          AGENTGATE_CONTRACTS_DIR: packages/contracts
        run: |
          npm ci
          npm ci --prefix packages/mcp
          npm test
      - name: Integration tests
        run: ctest --preset ci-linux -L integration --output-on-failure
