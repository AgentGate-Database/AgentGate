<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentGate walkthrough</title>
  <style>
    body { font-family: "Iowan Old Style", Palatino, Georgia, serif; margin: 0; background: #141210; color: #f4f1ea; color-scheme: dark; }
    header { padding: 1.25rem 1.5rem 0.25rem; }
    h1 { font-size: 1.6rem; margin: 0; }
    p.lead { margin: 0.35rem 0 0; max-width: 46rem; color: #cfc6b8; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1rem 1.5rem 2rem; }
    section { background: #221f1b; border: 1px solid #3a342c; border-radius: 8px; padding: 1rem 1.1rem; min-height: 16rem; }
    section.active { border-color: #f4f1ea; box-shadow: inset 0 0 0 2px #f4f1ea; }
    h2 { font-size: 1.05rem; margin: 0 0 0.75rem; }
    .logos { display: flex; flex-wrap: wrap; align-items: center; gap: 0.85rem; margin: 0 0 0.85rem; }
    .logo { font-family: system-ui, sans-serif; font-weight: 650; letter-spacing: -0.03em; line-height: 1; opacity: 0.35; }
    .logo.speaking { opacity: 1; }
    .logo-openai { font-size: 0.95rem; }
    .logo-anthropic { font-family: Georgia, serif; font-weight: 500; font-size: 0.95rem; }
    .logo-google { font-size: 1rem; font-weight: 500; }
    .logo-google span:nth-child(1) { color: #4285f4; }
    .logo-google span:nth-child(2) { color: #ea4335; }
    .logo-google span:nth-child(3) { color: #fbbc05; }
    .logo-google span:nth-child(4) { color: #4285f4; }
    .logo-google span:nth-child(5) { color: #34a853; }
    .logo-google span:nth-child(6) { color: #ea4335; }
    .logo-microsoft { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.95rem; }
    .logo-microsoft span { display: inline-flex; gap: 2px; width: 16px; height: 16px; flex-wrap: wrap; }
    .logo-microsoft i { display: block; width: 7px; height: 7px; }
    .logo-microsoft i:nth-child(1) { background: #f25022; }
    .logo-microsoft i:nth-child(2) { background: #7fba00; }
    .logo-microsoft i:nth-child(3) { background: #00a4ef; }
    .logo-microsoft i:nth-child(4) { background: #ffb900; }
    .logo-cursor { font-size: 0.95rem; }
    .request { min-height: 4.5rem; margin: 0; background: #2c2823; border-radius: 6px; padding: 0.85rem 0.9rem; }
    table { width: 100%; border-collapse: collapse; font-family: system-ui, sans-serif; font-size: 0.82rem; }
    th, td { text-align: left; padding: 0.45rem 0.45rem; border-bottom: 1px solid #3a342c; vertical-align: top; }
    th { color: #b7aea0; font-weight: 650; font-size: 0.75rem; letter-spacing: 0.02em; }
    tr.changed td { background: #3d3420; }
    td.pending { color: #e0b15a; }
    td.approved { color: #7dcea0; }
    td.declined { color: #e08b8b; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>AgentGate</h1>
    <p class="lead">Postgres pull requests for AI agents.</p>
  </header>
  <main>
    <section id="intent">
      <h2>1. AI Agent</h2>
      <div class="logos" aria-label="AI agent companies">
        <span class="logo logo-openai" data-agent="OpenAI">OpenAI</span>
        <span class="logo logo-anthropic" data-agent="Anthropic">Anthropic</span>
        <span class="logo logo-google" data-agent="Google" aria-label="Google"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></span>
        <span class="logo logo-microsoft" data-agent="Microsoft"><span><i></i><i></i><i></i><i></i></span>Microsoft</span>
        <span class="logo logo-cursor" data-agent="Cursor">Cursor</span>
      </div>
      <p class="request" id="intent-body"></p>
    </section>
    <section id="gate">
      <h2>2. AgentGate status</h2>
      <table>
        <thead>
          <tr><th>Agent</th><th>Request</th><th>Status</th></tr>
        </thead>
        <tbody id="gate-body"></tbody>
      </table>
    </section>
    <section id="company">
      <h2>3. Company dashboard</h2>
      <table>
        <thead>
          <tr><th>Agent</th><th>Request</th><th>Status</th></tr>
        </thead>
        <tbody id="company-body"></tbody>
      </table>
    </section>
    <section id="business">
      <h2>4. Business data in Postgres</h2>
      <table>
        <thead>
          <tr><th>Name</th><th>Date of birth</th><th>Email</th></tr>
        </thead>
        <tbody id="business-body"></tbody>
      </table>
    </section>
  </main>
  <script>
    const beat = 1100;
    const seed = [
      { name: "Maya Chen", date_of_birth: "03/14/1990", email: "maya.chen@example.com" },
      { name: "Jordan Lee", date_of_birth: "11/02/1988", email: "jordan.lee@example.com" },
      { name: "Sam Patel", date_of_birth: "01/09/1994", email: "sam.patel@example.com" }
    ];
    const requests = [
      {
        agent: "OpenAI",
        text: "Update Maya Chen’s date of birth to 06/21/1995.",
        decision: "Approved",
        apply: (rows) => updateRow(rows, "Maya Chen", { date_of_birth: "06/21/1995" })
      },
      {
        agent: "Anthropic",
        text: "Add Avery Kim, born 08/03/1992.",
        decision: "Approved",
        apply: (rows) => rows.push({ name: "Avery Kim", date_of_birth: "08/03/1992", email: "avery.kim@example.com", changed: true })
      },
      {
        agent: "Google",
        text: "Update Jordan Lee’s email to jordan@lee.dev.",
        decision: "Declined",
        apply: null
      },
      {
        agent: "Microsoft",
        text: "Update Sam Patel’s date of birth to 04/17/1991.",
        decision: "Approved",
        apply: (rows) => updateRow(rows, "Sam Patel", { date_of_birth: "04/17/1991" })
      },
      {
        agent: "Cursor",
        text: "Add Riley Nguyen, born 12/28/1996.",
        decision: "Approved",
        apply: (rows) => rows.push({ name: "Riley Nguyen", date_of_birth: "12/28/1996", email: "riley.nguyen@example.com", changed: true })
      }
    ];

    const intent = document.querySelector("#intent-body");
    const gateBody = document.querySelector("#gate-body");
    const companyBody = document.querySelector("#company-body");
    const businessBody = document.querySelector("#business-body");
    let customers = [];
    let gateItems = [];
    let companyItems = [];

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function updateRow(rows, name, fields) {
      const row = rows.find((item) => item.name === name);
      Object.assign(row, fields, { changed: true });
    }

    function highlight(id) {
      document.querySelectorAll("main section").forEach((section) => {
        section.classList.toggle("active", section.id === id);
      });
    }

    function showAgent(request) {
      document.querySelectorAll(".logo").forEach((logo) => {
        logo.classList.toggle("speaking", logo.dataset.agent === request.agent);
      });
      intent.textContent = request.text;
    }

    function statusClass(status) {
      if (status === "Approved") return "approved";
      if (status === "Declined") return "declined";
      return "pending";
    }

    function rowsHtml(items) {
      return items.map((item) =>
        "<tr><td>" + escapeHtml(item.agent) + "</td><td>" + escapeHtml(item.text) +
        "</td><td class=\"" + statusClass(item.status) + "\">" + escapeHtml(item.status) + "</td></tr>"
      ).join("");
    }

    function renderSubmissions() {
      gateBody.innerHTML = rowsHtml(gateItems);
      companyBody.innerHTML = rowsHtml(companyItems);
    }

    function renderCustomers() {
      businessBody.innerHTML = customers.map((row) =>
        "<tr" + (row.changed ? " class=\"changed\"" : "") + "><td>" + escapeHtml(row.name) +
        "</td><td>" + escapeHtml(row.date_of_birth) + "</td><td>" + escapeHtml(row.email) + "</td></tr>"
      ).join("");
    }

    function reset() {
      customers = seed.map((row) => ({ ...row }));
      gateItems = [];
      companyItems = [];
      intent.textContent = "";
      document.querySelectorAll(".logo").forEach((logo) => logo.classList.remove("speaking"));
      renderSubmissions();
      renderCustomers();
      highlight("");
    }

    async function play(request) {
      highlight("intent");
      showAgent(request);
      await sleep(beat);

      highlight("gate");
      gateItems.push({ agent: request.agent, text: request.text, status: "Pending review" });
      renderSubmissions();
      await sleep(beat);

      highlight("company");
      companyItems.push({ agent: request.agent, text: request.text, status: "Pending review" });
      renderSubmissions();
      await sleep(beat);

      gateItems[gateItems.length - 1].status = request.decision;
      companyItems[companyItems.length - 1].status = request.decision;
      renderSubmissions();
      await sleep(beat);

      if (request.decision === "Approved") {
        highlight("business");
        customers.forEach((row) => { row.changed = false; });
        request.apply(customers);
        renderCustomers();
        await sleep(beat);
      }
    }

    async function run() {
      while (true) {
        reset();
        await sleep(beat);
        for (const request of requests) {
          await play(request);
        }
        await sleep(beat);
      }
    }

    reset();
    run();
  </script>
</body>
</html>
